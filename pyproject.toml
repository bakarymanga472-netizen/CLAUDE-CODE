[project]
name = "pronostiqueur"
version = "0.1.0"
description = "IA de prédiction des buts par mi-temps (analyse et simulation, sans placement de paris)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pronostiqueur = "pronostiqueur.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pronostiqueur*"]

[tool.setuptools.package-data]
pronostiqueur = ["data/schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
