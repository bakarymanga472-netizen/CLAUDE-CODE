name: pronostiqueur-tests

on:
  push:
    paths: ['projets/pronostiqueur/**', '.github/workflows/pronostiqueur-tests.yml']
  pull_request:
    paths: ['projets/pronostiqueur/**', '.github/workflows/pronostiqueur-tests.yml']

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projets/pronostiqueur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
