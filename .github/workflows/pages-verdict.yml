name: Pages Verdict
on:
  push:
    branches: [main]
    paths: ['projets/kickly-honnete/**', '.github/workflows/pages-verdict.yml']
  schedule:
    - cron: '17 */3 * * *'     # données ESPN rafraîchies toutes les 3 heures
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests des modèles
        working-directory: projets/kickly-honnete
        run: node tests/models.test.js
      - name: Assembler le site et récupérer les données
        working-directory: projets/kickly-honnete
        run: |
          mkdir -p ../../_site
          cp index.html style.css app.js models.js ../../_site/
          node scripts/build-data.js ../../_site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
